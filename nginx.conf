map $request_uri $path_only {
    default $request_uri;
    ~^([^?]*) $1;
}

map $path_only $canonical_path {
    default $path_only;
    /index.html /;
    ~^(.+)/$ $1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # www and plain HTTP never reach a second copy of the site.
    # Traefik may already redirect HTTP; this covers requests that arrive here.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    if ($http_x_forwarded_proto = "http") {
        return 301 https://railwaydesign.xyz$request_uri;
    }

    location = /index.html {
        return 301 https://railwaydesign.xyz/$is_args$args;
    }

    location ~ ^/(.+)/$ {
        return 301 https://railwaydesign.xyz/$1$is_args$args;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
        charset utf-8;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(glb|hdr|exr|woff2|ttf|otf|svg|ico|png|jpg|jpeg|webp|mp4)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'https://railwaydesign.xyz__CANONICAL_PATH__' 'https://railwaydesign.xyz$canonical_path';
        try_files $uri $uri/ /index.html;
    }
}
